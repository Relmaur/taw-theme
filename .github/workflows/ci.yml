name: CI

# The checks live in taw/core (shared workflow theme-ci.yml) and update with
# it; this file only says when to run them. Framework-owned: replaced on sync.
# By hand: see the "By hand" notes at the top of
# vendor/taw/core/.github/workflows/theme-ci.yml.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    uses: Relmaur/taw-core/.github/workflows/theme-ci.yml@v1
    with:
      smoke: true
      build: false
