name: Framework Sync

# Weekly: bump taw/core, apply the framework-owned files, run the checks, and
# open one pull request when anything changed. The job lives in taw/core
# (shared workflow theme-framework-sync.yml). Framework-owned: replaced on sync.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: Relmaur/taw-core/.github/workflows/theme-framework-sync.yml@v1
    with:
      smoke: true
